spring.application.name=event-ticketing

server.port=${PORT:4040}
# Load environment variables from .env
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Aiven MySQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial Schema

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Groq AI Configuration
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.api-key=${GROQ_API_KEY:}
groq.connect-timeout-ms=${GROQ_CONNECT_TIMEOUT_MS:5000}
groq.read-timeout-ms=${GROQ_READ_TIMEOUT_MS:20000}
